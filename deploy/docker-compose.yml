# Three-node cluster on one Docker host, for trying raftkv out.
#   docker compose -f deploy/docker-compose.yml up --build
#
# This is a demo topology. For real fault tolerance, each node needs its own
# machine and disk.

x-node: &node
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: raftkv:1.0.0
  restart: unless-stopped
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD", "raftkv-cli", "--nodes", "1=127.0.0.1:7100", "status"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  node1:
    <<: *node
    hostname: node1
    command: >
      --id 1 --cluster-id 1 --data-dir /var/lib/raftkv
      --peer-listen 0.0.0.0:7000 --client-listen 0.0.0.0:7100 --metrics-listen 0.0.0.0:9100
      --peers 2=node2:7000,3=node3:7000
    ports: ["7101:7100", "9101:9100"]
    volumes: ["node1:/var/lib/raftkv"]
  node2:
    <<: *node
    hostname: node2
    command: >
      --id 2 --cluster-id 1 --data-dir /var/lib/raftkv
      --peer-listen 0.0.0.0:7000 --client-listen 0.0.0.0:7100 --metrics-listen 0.0.0.0:9100
      --peers 1=node1:7000,3=node3:7000
    ports: ["7102:7100", "9102:9100"]
    volumes: ["node2:/var/lib/raftkv"]
  node3:
    <<: *node
    hostname: node3
    command: >
      --id 3 --cluster-id 1 --data-dir /var/lib/raftkv
      --peer-listen 0.0.0.0:7000 --client-listen 0.0.0.0:7100 --metrics-listen 0.0.0.0:9100
      --peers 1=node1:7000,2=node2:7000
    ports: ["7103:7100", "9103:9100"]
    volumes: ["node3:/var/lib/raftkv"]

volumes:
  node1:
  node2:
  node3:
